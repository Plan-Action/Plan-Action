name: Permission regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sesisenaiaction-hub-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sesisenaiaction-hub-main/package-lock.json
      - run: npm ci
      - name: Test Dependabot merge gates
        run: node --test ../.github/scripts/dependabot-policy.test.cjs
      - run: npm run build
      - run: npm run test:security
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: node --test scripts/test-user-management.mjs
      - run: npm run test:navigation
      - name: Validate legacy migration inventory
        run: node --test scripts/test-inventory-legacy.mjs
      - name: Validate Neon client error boundaries
        run: node --test scripts/test-neon-client-errors.mjs
      - name: Verify reviewed dependency fixes
        run: npm run audit:dependencies
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/permission-runtime" --no-package-lock --no-save --ignore-scripts @electric-sql/pglite@0.3.14 playwright@1.64.1
      - name: Install browser for navigation regression checks
        run: node "$RUNNER_TEMP/permission-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise navigation on desktop and mobile
        run: npm run test:navigation:browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/permission-runtime/node_modules/playwright/index.mjs
      - name: Exercise database permissions
        run: node --test scripts/test-permissions.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/permission-runtime/node_modules/@electric-sql/pglite/dist/index.js
      - name: Exercise regional catalog permissions
        run: node --test scripts/test-regional-catalog.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/permission-runtime/node_modules/@electric-sql/pglite/dist/index.js
